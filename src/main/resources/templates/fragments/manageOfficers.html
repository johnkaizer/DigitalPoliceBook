<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officers Management</title>
    <style>

        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        /* Button styling */
        .btn {
            display: inline-block;
            padding: 8px 12px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-warning {
            background-color: #ffc107;
            color: #212529;
        }

        /* Action buttons container */
        .action-buttons {
            white-space: nowrap;
        }

        /* Search and filter area */
        .search-filter {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .search-box {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 300px;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 60%;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        /* Form styling */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin-right: -10px;
            margin-left: -10px;
        }

        .form-col {
            flex: 0 0 50%;
            max-width: 50%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .modal-footer {
            padding-top: 15px;
            text-align: right;
            border-top: 1px solid #ddd;
            margin-top: 15px;
        }

        /* Alert messages */
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
        }

        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .alert-danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        /* Responsive adjustments */
        @media screen and (max-width: 768px) {
            .form-col {
                flex: 0 0 100%;
                max-width: 100%;
            }

            .search-filter {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
                margin-bottom: 10px;
            }

            .modal-content {
                width: 95%;
            }
        }

        /* Loading spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #007bff;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        #notification-area {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }
    </style>
</head>
<body>
<div id="notification-area"></div>

<div class="loading-overlay">
    <div class="spinner"></div>
</div>

<h1>Officers Management</h1>

<div class="container">
    <div class="search-filter">
        <div>
            <input type="text" id="searchInput" class="search-box" placeholder="Search officers...">
        </div>
        <div>
            <button id="addOfficerBtn" class="btn btn-primary">Add New Officer</button>
        </div>
    </div>

    <div id="alertArea"></div>

    <div class="spinner" id="tableSpinner"></div>

    <table id="officersTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>ID Number</th>
            <th>Officer Number</th>
            <th>Role</th>
            <th>Gender</th>
            <th>Specialization</th>
            <th>Email</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Table data will be populated by JavaScript -->
        </tbody>
    </table>
</div>

<!-- Modal for Add/Edit Officer -->
<div id="officerModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Add New Officer</h2>

        <form id="officerForm">
            <input type="hidden" id="officerId">

            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="idNumber">ID Number</label>
                        <input type="text" id="idNumber" class="form-control" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="officerNumber">Officer Number</label>
                        <input type="text" id="officerNumber" class="form-control" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" class="form-control" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="specialization">Specialization</label>
                        <input type="text" id="specialization" class="form-control" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role" class="form-control" required>
                            <option value="">Select Role</option>
                            <option value="Admin">Admin</option>
                            <option value="Officer">Officer</option>
                            <option value="Sergeant">Sergeant</option>
                            <option value="Inspector">Inspector</option>
                            <option value="Chief">Chief</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control">
                        <small id="passwordHint" class="form-text text-muted">Leave blank to keep current password when editing.</small>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" class="form-control" required>
                            <option value="">Select Status</option>
                            <option value="ACTIVE">Active</option>
                            <option value="INACTIVE">Inactive</option>
                            <option value="ON_LEAVE">On Leave</option>
                            <option value="SUSPENDED">Suspended</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-danger" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn btn-success" id="saveBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
    <div class="modal-content" style="width: 400px;">
        <span class="close" id="closeDeleteModal">&times;</span>
        <h2>Confirm Delete</h2>
        <p>Are you sure you want to delete this officer? This action cannot be undone.</p>
        <input type="hidden" id="deleteOfficerId">
        <div class="modal-footer">
            <button type="button" class="btn btn-success" id="cancelDeleteBtn">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        // API base URL
        const apiUrl = '/api/officers';

        // Function to show loading spinner
        function showLoading() {
            $('.loading-overlay').show();
        }

        // Function to hide loading spinner
        function hideLoading() {
            $('.loading-overlay').hide();
        }

        // Function to show notifications
        function showNotification(message, type) {
            // Create notification element
            const notification = $('<div class="alert alert-' + type + '">' + message + '</div>');

            // Add to notification area
            $('#notification-area').append(notification);

            // Auto remove after 3 seconds
            setTimeout(function() {
                notification.fadeOut(500, function() {
                    $(this).remove();
                });
            }, 3000);
        }

        // Function to show alert messages
        function showAlert(message, type) {
            const alertHtml = '<div class="alert alert-' + type + '">' + message + '</div>';
            $('#alertArea').html(alertHtml);

            // Auto hide after 5 seconds
            setTimeout(function() {
                $('#alertArea').html('');
            }, 5000);
        }

        // Load all officers
        function loadOfficers() {
            $('#tableSpinner').show();

            $.ajax({
                url: apiUrl,
                type: 'GET',
                dataType: 'json',
                success: function(data) {
                    populateTable(data);
                    $('#tableSpinner').hide();
                },
                error: function(xhr, status, error) {
                    console.error('Error loading officers:', error);
                    showAlert('Failed to load officers. Please try again later.', 'danger');
                    $('#tableSpinner').hide();
                }
            });
        }

        // Populate table with officers data
        function populateTable(officers) {
            const tbody = $('#officersTable tbody');
            tbody.empty();

            if (officers.length === 0) {
                tbody.html('<tr><td colspan="10" style="text-align: center;">No officers found</td></tr>');
                return;
            }

            officers.forEach(function(officer) {
                const row = $('<tr>');

                row.append($('<td>').text(officer.id));
                row.append($('<td>').text(officer.name));
                row.append($('<td>').text(officer.idNumber));
                row.append($('<td>').text(officer.officerNumber));
                row.append($('<td>').text(officer.role));
                row.append($('<td>').text(officer.gender));
                row.append($('<td>').text(officer.specialization));
                row.append($('<td>').text(officer.email));

                // Status with color coding
                const statusCell = $('<td>');
                const statusSpan = $('<span>').text(officer.status);
                if (officer.status === 'ACTIVE') {
                    statusSpan.css('color', 'green');
                } else if (officer.status === 'INACTIVE' || officer.status === 'SUSPENDED') {
                    statusSpan.css('color', 'red');
                } else if (officer.status === 'ON_LEAVE') {
                    statusSpan.css('color', 'orange');
                }
                statusCell.append(statusSpan);
                row.append(statusCell);

                // Action buttons
                const actionsCell = $('<td class="action-buttons">');

                // Edit button
                const editBtn = $('<button class="btn btn-warning btn-sm edit-officer">').text('Edit');
                editBtn.attr('data-id', officer.id);
                actionsCell.append(editBtn);

                // Delete button
                const deleteBtn = $('<button class="btn btn-danger btn-sm delete-officer">').text('Delete');
                deleteBtn.attr('data-id', officer.id);
                actionsCell.append(deleteBtn);

                row.append(actionsCell);
                tbody.append(row);
            });
        }

        // Function to open the officer modal
        function openOfficerModal(title, officerId = null) {
            $('#modalTitle').text(title);
            $('#officerId').val(officerId);

            // Clear form
            $('#officerForm')[0].reset();

            // Show/hide password hint
            if (officerId) {
                $('#passwordHint').show();
            } else {
                $('#passwordHint').hide();
            }

            // If editing, load officer data
            if (officerId) {
                showLoading();

                $.ajax({
                    url: apiUrl + '/' + officerId,
                    type: 'GET',
                    dataType: 'json',
                    success: function(officer) {
                        $('#name').val(officer.name);
                        $('#idNumber').val(officer.idNumber);
                        $('#officerNumber').val(officer.officerNumber);
                        $('#gender').val(officer.gender);
                        $('#specialization').val(officer.specialization);
                        $('#role').val(officer.role);
                        $('#email').val(officer.email);
                        $('#username').val(officer.username);
                        // Don't set password as it's not returned from API
                        $('#status').val(officer.status);

                        hideLoading();
                    },
                    error: function(xhr, status, error) {
                        console.error('Error loading officer details:', error);
                        showNotification('Failed to load officer details', 'danger');
                        hideLoading();
                        closeOfficerModal();
                    }
                });
            }

            $('#officerModal').css('display', 'block');
        }

        // Function to close the officer modal
        function closeOfficerModal() {
            $('#officerModal').css('display', 'none');
        }

        // Function to open the delete confirmation modal
        function openDeleteModal(officerId) {
            $('#deleteOfficerId').val(officerId);
            $('#deleteModal').css('display', 'block');
        }

        // Function to close the delete confirmation modal
        function closeDeleteModal() {
            $('#deleteModal').css('display', 'none');
        }

        // Handle form submission
        $('#officerForm').submit(function(e) {
            e.preventDefault();

            const officerId = $('#officerId').val();
            const isEdit = officerId !== '';

            // Validate form
            if (!$('#name').val() || !$('#idNumber').val() || !$('#officerNumber').val() ||
                !$('#gender').val() || !$('#specialization').val() || !$('#role').val() ||
                !$('#email').val() || !$('#username').val() || !$('#status').val()) {
                showNotification('Please fill all required fields', 'danger');
                return;
            }

            // If adding new officer, password is required
            if (!isEdit && !$('#password').val()) {
                showNotification('Password is required for new officers', 'danger');
                return;
            }

            // Prepare data
            const officerData = {
                name: $('#name').val(),
                idNumber: $('#idNumber').val(),
                officerNumber: $('#officerNumber').val(),
                gender: $('#gender').val(),
                specialization: $('#specialization').val(),
                role: $('#role').val(),
                email: $('#email').val(),
                username: $('#username').val(),
                status: $('#status').val()
            };

            // Add password only if provided (for new officers or password changes)
            if ($('#password').val()) {
                officerData.password = $('#password').val();
            }

            // If editing, add ID to data
            if (isEdit) {
                officerData.id = officerId;
            }

            showLoading();

            // API call
            $.ajax({
                url: isEdit ? apiUrl + '/' + officerId : apiUrl,
                type: isEdit ? 'PUT' : 'POST',
                contentType: 'application/json',
                data: JSON.stringify(officerData),
                success: function(response) {
                    showNotification(isEdit ? 'Officer updated successfully' : 'Officer added successfully', 'success');
                    closeOfficerModal();
                    loadOfficers();
                    hideLoading();
                },
                error: function(xhr, status, error) {
                    console.error('Error saving officer:', error);
                    showNotification('Failed to save officer. Please try again.', 'danger');
                    hideLoading();
                }
            });
        });

        // Handle delete confirmation
        $('#confirmDeleteBtn').click(function() {
            const officerId = $('#deleteOfficerId').val();

            if (!officerId) {
                closeDeleteModal();
                return;
            }

            showLoading();

            $.ajax({
                url: apiUrl + '/' + officerId,
                type: 'DELETE',
                success: function(response) {
                    showNotification('Officer deleted successfully', 'success');
                    closeDeleteModal();
                    loadOfficers();
                    hideLoading();
                },
                error: function(xhr, status, error) {
                    console.error('Error deleting officer:', error);
                    showNotification('Failed to delete officer. Please try again.', 'danger');
                    hideLoading();
                }
            });
        });

        // Search functionality
        $('#searchInput').on('keyup', function() {
            const value = $(this).val().toLowerCase();
            $('#officersTable tbody tr').filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });

        // Event listeners for buttons

        // Add new officer button
        $('#addOfficerBtn').click(function() {
            openOfficerModal('Add New Officer');
        });

        // Edit officer button (delegated)
        $(document).on('click', '.edit-officer', function() {
            const officerId = $(this).data('id');
            openOfficerModal('Edit Officer', officerId);
        });

        // Delete officer button (delegated)
        $(document).on('click', '.delete-officer', function() {
            const officerId = $(this).data('id');
            openDeleteModal(officerId);
        });

        // Close modal buttons
        $('.close, #cancelBtn').click(function() {
            closeOfficerModal();
        });

        $('#closeDeleteModal, #cancelDeleteBtn').click(function() {
            closeDeleteModal();
        });

        // Initial load of officers
        loadOfficers();
    });
</script>
</body>
</html>
