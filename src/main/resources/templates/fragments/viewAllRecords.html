<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cases Management</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5rem;
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        /* Button styling */
        .btn {
            display: inline-block;
            padding: 8px 12px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-success:hover {
            background-color: #1e7e34;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .btn-warning {
            background-color: #ffc107;
            color: #212529;
        }

        .btn-warning:hover {
            background-color: #e0a800;
        }

        .btn-info {
            background-color: #17a2b8;
            color: white;
        }

        .btn-info:hover {
            background-color: #138496;
        }

        .btn-sm {
            padding: 5px 8px;
            font-size: 12px;
        }

        /* Action buttons container */
        .action-buttons {
            white-space: nowrap;
        }

        /* Search and filter area */
        .search-filter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 250px;
        }

        .filter-select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 150px;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 800px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        /* Form styling */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin-right: -10px;
            margin-left: -10px;
        }

        .form-col {
            flex: 0 0 50%;
            max-width: 50%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .form-col-full {
            flex: 0 0 100%;
            max-width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .modal-footer {
            padding-top: 15px;
            text-align: right;
            border-top: 1px solid #ddd;
            margin-top: 15px;
        }

        /* Alert messages */
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
        }

        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .alert-danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .alert-info {
            color: #0c5460;
            background-color: #d1ecf1;
            border-color: #bee5eb;
        }

        /* Status badges */
        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-open { background-color: #e3f2fd; color: #1976d2; }
        .status-investigating { background-color: #fff3e0; color: #f57c00; }
        .status-closed { background-color: #f3e5f5; color: #7b1fa2; }
        .status-resolved { background-color: #e8f5e8; color: #388e3c; }
        .status-transferred { background-color: #fce4ec; color: #c2185b; }

        /* Responsive adjustments */
        @media screen and (max-width: 768px) {
            .form-col {
                flex: 0 0 100%;
                max-width: 100%;
            }

            .search-filter {
                flex-direction: column;
                align-items: stretch;
            }

            .search-controls {
                justify-content: center;
            }

            .search-box {
                width: 100%;
                margin-bottom: 10px;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 4px;
            }
        }

        /* Loading spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #007bff;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        #notification-area {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }

        .case-description {
            max-width: 200px;
            word-wrap: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .case-description:hover {
            white-space: normal;
            overflow: visible;
        }

        .table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>
<body>
<div id="notification-area"></div>

<div class="loading-overlay">
    <div class="spinner"></div>
</div>

<div class="container">
    <h1> Cases Management</h1>

    <div class="search-filter">
        <div class="search-controls">
            <input type="text" id="searchInput" class="search-box" placeholder="Search cases...">
            <select id="statusFilter" class="filter-select">
                <option value="">All Statuses</option>
                <option value="OPEN">Open</option>
                <option value="INVESTIGATING">Investigating</option>
                <option value="CLOSED">Closed</option>
                <option value="RESOLVED">Resolved</option>
                <option value="TRANSFERRED">Transferred</option>
            </select>
        </div>
        <div>
            <button id="addCaseBtn" class="btn btn-primary">Add New Case</button>
        </div>
    </div>

    <div id="alertArea"></div>

    <div class="spinner" id="tableSpinner"></div>

    <div class="table-wrapper">
        <table id="casesTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Case Number</th>
                <th>Reporter Name</th>
                <th>Reporter Phone</th>
                <th>Reporter ID</th>
                <th>Officer ID</th>
                <th>Status</th>
                <th>Date</th>
                <th>Location</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Table data will be populated by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal for Add/Edit Case -->
<div id="caseModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Add New Case</h2>

        <form id="caseForm">
            <input type="hidden" id="caseId">

            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="caseNumber">Case Number</label>
                        <input type="text" id="caseNumber" class="form-control" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="officerId">Officer ID</label>
                        <input type="text" id="officerId" class="form-control" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="reporterName">Reporter Name</label>
                        <input type="text" id="reporterName" class="form-control" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="reporterPhone">Reporter Phone</label>
                        <input type="tel" id="reporterPhone" class="form-control" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="reporterIdNumber">Reporter ID Number</label>
                        <input type="text" id="reporterIdNumber" class="form-control" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" class="form-control" required>
                            <option value="">Select Status</option>
                            <option value="OPEN">Open</option>
                            <option value="INVESTIGATING">Investigating</option>
                            <option value="CLOSED">Closed</option>
                            <option value="RESOLVED">Resolved</option>
                            <option value="TRANSFERRED">Transferred</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="datetime-local" id="date" class="form-control" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" class="form-control" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col-full">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" class="form-control" rows="4" required placeholder="Enter case description..."></textarea>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-danger" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn btn-success" id="saveBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Case Details Modal -->
<div id="caseDetailsModal" class="modal">
    <div class="modal-content">
        <span class="close" id="closeCaseDetailsModal">&times;</span>
        <h2>Case Details</h2>
        <div id="caseDetailsContent">
            <!-- Case details will be populated here -->
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="closeCaseDetailsBtn">Close</button>
        </div>
    </div>
</div>

<!-- Status Update Modal -->
<div id="statusModal" class="modal">
    <div class="modal-content" style="width: 400px;">
        <span class="close" id="closeStatusModal">&times;</span>
        <h2>Update Case Status</h2>
        <form id="statusForm">
            <input type="hidden" id="statusCaseId">
            <div class="form-group">
                <label for="newStatus">New Status</label>
                <select id="newStatus" class="form-control" required>
                    <option value="">Select Status</option>
                    <option value="OPEN">Open</option>
                    <option value="INVESTIGATING">Investigating</option>
                    <option value="CLOSED">Closed</option>
                    <option value="RESOLVED">Resolved</option>
                    <option value="TRANSFERRED">Transferred</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" id="cancelStatusBtn">Cancel</button>
                <button type="submit" class="btn btn-success" id="updateStatusBtn">Update Status</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
    <div class="modal-content" style="width: 400px;">
        <span class="close" id="closeDeleteModal">&times;</span>
        <h2>Confirm Delete</h2>
        <p>Are you sure you want to delete this case? This action cannot be undone.</p>
        <input type="hidden" id="deleteCaseId">
        <div class="modal-footer">
            <button type="button" class="btn btn-success" id="cancelDeleteBtn">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        // API base URL
        const apiUrl = '/api/cases';

        // Function to show loading spinner
        function showLoading() {
            $('.loading-overlay').show();
        }

        // Function to hide loading spinner
        function hideLoading() {
            $('.loading-overlay').hide();
        }

        // Function to show notifications
        function showNotification(message, type) {
            const notification = $('<div class="alert alert-' + type + '">' + message + '</div>');
            $('#notification-area').append(notification);

            setTimeout(function() {
                notification.fadeOut(500, function() {
                    $(this).remove();
                });
            }, 5000);
        }

        // Function to show alert messages
        function showAlert(message, type) {
            const alertHtml = '<div class="alert alert-' + type + '">' + message + '</div>';
            $('#alertArea').html(alertHtml);

            setTimeout(function() {
                $('#alertArea').html('');
            }, 5000);
        }

        // Function to format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        // Function to get status badge HTML
        function getStatusBadge(status) {
            const statusClass = 'status-' + status.toLowerCase();
            return '<span class="status-badge ' + statusClass + '">' + status + '</span>';
        }

        // Load all cases
        function loadCases() {
            $('#tableSpinner').show();

            $.ajax({
                url: apiUrl,
                type: 'GET',
                dataType: 'json',
                success: function(data) {
                    populateTable(data);
                    $('#tableSpinner').hide();
                },
                error: function(xhr, status, error) {
                    console.error('Error loading cases:', error);
                    showAlert('Failed to load cases. Please try again later.', 'danger');
                    $('#tableSpinner').hide();
                }
            });
        }

        // Populate table with cases data
        function populateTable(cases) {
            const tbody = $('#casesTable tbody');
            tbody.empty();

            if (cases.length === 0) {
                tbody.html('<tr><td colspan="11" style="text-align: center;">No cases found</td></tr>');
                return;
            }

            cases.forEach(function(caseItem) {
                const row = $('<tr>');

                row.append($('<td>').text(caseItem.id));
                row.append($('<td>').text(caseItem.caseNumber));
                row.append($('<td>').text(caseItem.reporterName));
                row.append($('<td>').text(caseItem.reporterPhone));
                row.append($('<td>').text(caseItem.reporterIdNumber));
                row.append($('<td>').text(caseItem.officerId));
                row.append($('<td>').html(getStatusBadge(caseItem.status)));
                row.append($('<td>').text(formatDate(caseItem.date)));
                row.append($('<td>').text(caseItem.location));

                // Description with ellipsis
                const descCell = $('<td class="case-description">').text(caseItem.description);
                descCell.attr('title', caseItem.description);
                row.append(descCell);

                // Action buttons
                const actionsCell = $('<td class="action-buttons">');

                // View details button
                const viewBtn = $('<button class="btn btn-info btn-sm view-case">').text('View');
                viewBtn.attr('data-id', caseItem.id);
                actionsCell.append(viewBtn);

                // Edit button
                const editBtn = $('<button class="btn btn-warning btn-sm edit-case">').text('Edit');
                editBtn.attr('data-id', caseItem.id);
                actionsCell.append(editBtn);

                // Update status button
                const statusBtn = $('<button class="btn btn-primary btn-sm update-status">').text('Status');
                statusBtn.attr('data-id', caseItem.id);
                actionsCell.append(statusBtn);

                // Delete button
                const deleteBtn = $('<button class="btn btn-danger btn-sm delete-case">').text('Delete');
                deleteBtn.attr('data-id', caseItem.id);
                actionsCell.append(deleteBtn);

                row.append(actionsCell);
                tbody.append(row);
            });
        }

        // Function to open the case modal
        function openCaseModal(title, caseId = null) {
            $('#modalTitle').text(title);
            $('#caseId').val(caseId);

            // Clear form
            $('#caseForm')[0].reset();

            // If editing, load case data
            if (caseId) {
                showLoading();

                $.ajax({
                    url: apiUrl + '/' + caseId,
                    type: 'GET',
                    dataType: 'json',
                    success: function(caseItem) {
                        $('#caseNumber').val(caseItem.caseNumber);
                        $('#reporterName').val(caseItem.reporterName);
                        $('#reporterPhone').val(caseItem.reporterPhone);
                        $('#reporterIdNumber').val(caseItem.reporterIdNumber);
                        $('#officerId').val(caseItem.officerId);
                        $('#status').val(caseItem.status);

                        // Format date for datetime-local input
                        const date = new Date(caseItem.date);
                        const formattedDate = date.toISOString().slice(0, 16);
                        $('#date').val(formattedDate);

                        $('#location').val(caseItem.location);
                        $('#description').val(caseItem.description);

                        hideLoading();
                    },
                    error: function(xhr, status, error) {
                        console.error('Error loading case details:', error);
                        showNotification('Failed to load case details', 'danger');
                        hideLoading();
                        closeCaseModal();
                    }
                });
            } else {
                // Set current date/time for new cases
                const now = new Date();
                const formattedNow = now.toISOString().slice(0, 16);
                $('#date').val(formattedNow);
            }

            $('#caseModal').css('display', 'block');
        }

        // Function to close the case modal
        function closeCaseModal() {
            $('#caseModal').css('display', 'none');
        }

        // Function to show case details
        function showCaseDetails(caseId) {
            showLoading();

            $.ajax({
                url: apiUrl + '/' + caseId,
                type: 'GET',
                dataType: 'json',
                success: function(caseItem) {
                    const detailsHtml = `
                        <div style="line-height: 1.8;">
                            <p><strong>Case Number:</strong> ${caseItem.caseNumber}</p>
                            <p><strong>Status:</strong> ${getStatusBadge(caseItem.status)}</p>
                            <p><strong>Date:</strong> ${formatDate(caseItem.date)}</p>
                            <p><strong>Location:</strong> ${caseItem.location}</p>
                            <p><strong>Officer ID:</strong> ${caseItem.officerId}</p>
                            <hr>
                            <p><strong>Reporter Name:</strong> ${caseItem.reporterName}</p>
                            <p><strong>Reporter Phone:</strong> ${caseItem.reporterPhone}</p>
                            <p><strong>Reporter ID Number:</strong> ${caseItem.reporterIdNumber}</p>
                            <hr>
                            <p><strong>Description:</strong></p>
                            <div style="background-color: #f8f9fa; padding: 15px; border-radius: 5px; margin-top: 10px;">
                                ${caseItem.description}
                            </div>
                        </div>
                    `;
                    $('#caseDetailsContent').html(detailsHtml);
                    $('#caseDetailsModal').css('display', 'block');
                    hideLoading();
                },
                error: function(xhr, status, error) {
                    console.error('Error loading case details:', error);
                    showNotification('Failed to load case details', 'danger');
                    hideLoading();
                }
            });
        }

        // Function to open status update modal
        function openStatusModal(caseId) {
            $('#statusCaseId').val(caseId);
            $('#newStatus').val('');
            $('#statusModal').css('display', 'block');
        }

        // Function to close status modal
        function closeStatusModal() {
            $('#statusModal').css('display', 'none');
        }

        // Function to open the delete confirmation modal
        function openDeleteModal(caseId) {
            $('#deleteCaseId').val(caseId);
            $('#deleteModal').css('display', 'block');
        }

        // Function to close the delete confirmation modal
        function closeDeleteModal() {
            $('#deleteModal').css('display', 'none');
        }

        // Handle case form submission
        $('#caseForm').submit(function(e) {
            e.preventDefault();

            const caseId = $('#caseId').val();
            const isEdit = caseId !== '';

            // Validate form
            if (!$('#caseNumber').val() || !$('#reporterName').val() || !$('#reporterPhone').val() ||
                !$('#reporterIdNumber').val() || !$('#officerId').val() || !$('#status').val() ||
                !$('#date').val() || !$('#location').val() || !$('#description').val()) {
                showNotification('Please fill all required fields', 'danger');
                return;
            }

            // Prepare data
            const caseData = {
                caseNumber: $('#caseNumber').val(),
                reporterName: $('#reporterName').val(),
                reporterPhone: $('#reporterPhone').val(),
                reporterIdNumber: $('#reporterIdNumber').val(),
                officerId: $('#officerId').val(),
                status: $('#status').val(),
                date: new Date($('#date').val()).toISOString(),
                location: $('#location').val(),
                description: $('#description').val()
            };

            showLoading();

            // API call
            $.ajax({
                url: isEdit ? apiUrl + '/' + caseId : apiUrl,
                type: isEdit ? 'PUT' : 'POST',
                contentType: 'application/json',
                data: JSON.stringify(caseData),
                success: function(response) {
                    showNotification(isEdit ? 'Case updated successfully' : 'Case added successfully', 'success');
                    closeCaseModal();
                    loadCases();
                    hideLoading();
                },
                error: function(xhr, status, error) {
                    console.error('Error saving case:', error);
                    let errorMessage = 'Failed to save case. Please try again.';

                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMessage = xhr.responseJSON.message;
                    }

                    showNotification(errorMessage, 'danger');
                    hideLoading();
                }
            });
        });

        // Handle status update form submission
        $('#statusForm').submit(function(e) {
            e.preventDefault();

            const caseId = $('#statusCaseId').val();
            const newStatus = $('#newStatus').val();

            if (!newStatus) {
                showNotification('Please select a status', 'danger');
                return;
            }

            showLoading();

            $.ajax({
                url: apiUrl + '/' + caseId + '/status',
                type: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({ status: newStatus }),
                success: function(response) {
                    showNotification('Case status updated successfully', 'success');
                    closeStatusModal();
                    loadCases();
                    hideLoading();
                },
                error: function(xhr, status, error) {
                    console.error('Error updating status:', error);
                    showNotification('Failed to update case status. Please try again.', 'danger');
                    hideLoading();
                }
            });
        });

        // Handle delete confirmation
        $('#confirmDeleteBtn').click(function() {
            const caseId = $('#deleteCaseId').val();

            if (!caseId) {
                closeDeleteModal();
                return;
            }

            showLoading();

            $.ajax({
                url: apiUrl + '/' + caseId,
                type: 'DELETE',
                success: function(response) {
                    showNotification('Case deleted successfully', 'success');
                    closeDeleteModal();
                    loadCases();
                    hideLoading();
                },
                error: function(xhr, status, error) {
                    console.error('Error deleting case:', error);
                    showNotification('Failed to delete case. Please try again.', 'danger');
                    hideLoading();
                }
            });
        });

        // Search functionality
        $('#searchInput').on('keyup', function() {
            const value = $(this).val().toLowerCase();
            $('#casesTable tbody tr').filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
            });
        });

        // Status filter functionality
        $('#statusFilter').on('change', function() {
            const selectedStatus = $(this).val();

            $('#casesTable tbody tr').each(function() {
                const row = $(this);
                if (selectedStatus === '') {
                    row.show();
                } else {
                    const statusCell = row.find('td:nth-child(7)').text().trim();
                    if (statusCell.toUpperCase() === selectedStatus) {
                        row.show();
                    } else {
                        row.hide();
                    }
                }
            });
        });

        // Event listeners for buttons

        // Add new case button
        $('#addCaseBtn').click(function() {
            openCaseModal('Add New Case');
        });

        // View case details button (delegated)
        $(document).on('click', '.view-case', function() {
            const caseId = $(this).data('id');
            showCaseDetails(caseId);
        });

        // Edit case button (delegated)
        $(document).on('click', '.edit-case', function() {
            const caseId = $(this).data('id');
            openCaseModal('Edit Case', caseId);
        });

        // Update status button (delegated)
        $(document).on('click', '.update-status', function() {
            const caseId = $(this).data('id');
            openStatusModal(caseId);
        });

        // Delete case button (delegated)
        $(document).on('click', '.delete-case', function() {
            const caseId = $(this).data('id');
            openDeleteModal(caseId);
        });

        // Close modal buttons
        $('.close, #cancelBtn').click(function() {
            closeCaseModal();
        });

        $('#closeCaseDetailsModal, #closeCaseDetailsBtn').click(function() {
            $('#caseDetailsModal').css('display', 'none');
        });

        $('#closeStatusModal, #cancelStatusBtn').click(function() {
            closeStatusModal();
        });

        $('#closeDeleteModal, #cancelDeleteBtn').click(function() {
            closeDeleteModal();
        });

        // Close modals when clicking outside
        $(window).click(function(event) {
            if (event.target.id === 'caseModal') {
                closeCaseModal();
            }
            if (event.target.id === 'caseDetailsModal') {
                $('#caseDetailsModal').css('display', 'none');
            }
            if (event.target.id === 'statusModal') {
                closeStatusModal();
            }
            if (event.target.id === 'deleteModal') {
                closeDeleteModal();
            }
        });

        // Auto-generate case number for new cases
        function generateCaseNumber() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const time = String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
            return `CASE-${year}${month}${day}-${time}`;
        }

        // Generate case number when adding new case
        $('#addCaseBtn').click(function() {
            setTimeout(function() {
                if (!$('#caseId').val()) {
                    $('#caseNumber').val(generateCaseNumber());
                }
            }, 100);
        });

        // Keyboard shortcuts
        $(document).keydown(function(e) {
            // Escape key to close modals
            if (e.key === 'Escape') {
                $('.modal:visible').each(function() {
                    $(this).css('display', 'none');
                });
            }

            // Ctrl/Cmd + N to add new case
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                openCaseModal('Add New Case');
            }
        });

        // Form validation helpers
        $('#reporterPhone').on('input', function() {
            let value = this.value.replace(/\D/g, '');
            if (value.length > 10) {
                value = value.slice(0, 10);
            }
            this.value = value;
        });

        $('#reporterIdNumber').on('input', function() {
            let value = this.value.replace(/\D/g, '');
            if (value.length > 8) {
                value = value.slice(0, 8);
            }
            this.value = value;
        });

        // Case number validation
        $('#caseNumber').on('blur', function() {
            const caseNumber = $(this).val();
            const caseId = $('#caseId').val();

            if (caseNumber && !caseId) {
                // Check if case number already exists (only for new cases)
                $.ajax({
                    url: apiUrl + '/number/' + encodeURIComponent(caseNumber),
                    type: 'GET',
                    success: function(data) {
                        if (data) {
                            showNotification('Case number already exists. Please use a different number.', 'danger');
                            $('#caseNumber').focus();
                        }
                    },
                    error: function(xhr) {
                        // 404 is expected if case number doesn't exist
                        if (xhr.status !== 404) {
                            console.error('Error checking case number:', xhr);
                        }
                    }
                });
            }
        });

        // Initialize tooltips for action buttons
        $('.action-buttons button').each(function() {
            const button = $(this);
            const buttonText = button.text();
            button.attr('title', buttonText + ' this case');
        });

        // Initial load of cases
        loadCases();

        // Auto-refresh every 30 seconds (optional)
        setInterval(function() {
            if (!$('.modal:visible').length) { // Only refresh if no modals are open
                loadCases();
            }
        }, 30000);
    });
</script>
</body>
</html>
