<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cases Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f9f9f9;
        }
        /* Search and filter area */
        .search-filter {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .search-filter {
                flex-direction: column;
            }

            .search-filter > div {
                margin-bottom: 10px;
            }
        }

        .search-box {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 300px;
        }

        /* Status filters */
        .status-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .status-filter {
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
        }

        .status-filter.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        /* Case status styling */
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            display: inline-block;
        }

        .status-open {
            background-color: #17a2b8;
            color: white;
        }

        .status-investigating {
            background-color: #ffc107;
            color: #212529;
        }

        .status-closed {
            background-color: #6c757d;
            color: white;
        }

        .status-resolved {
            background-color: #28a745;
            color: white;
        }

        .status-transferred {
            background-color: #dc3545;
            color: white;
        }

        /* View details modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 70%;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        /* Case details styling */
        .case-details {
            margin-top: 20px;
        }

        .case-detail-row {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .case-detail-label {
            width: 30%;
            font-weight: bold;
        }

        .case-detail-value {
            width: 70%;
        }

        .case-description {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            white-space: pre-line;
        }

        /* Loading spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #007bff;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        /* Notifications */
        #notification-area {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .alert-danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        /* No cases message */
        .no-cases {
            text-align: center;
            padding: 30px;
            font-style: italic;
            color: #666;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .pagination button {
            margin: 0 5px;
            padding: 5px 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            cursor: pointer;
            border-radius: 3px;
        }

        .pagination button.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        .pagination button:disabled {
            background-color: #f0f0f0;
            color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div id="notification-area"></div>

<div class="loading-overlay">
    <div class="spinner"></div>
</div>

<div class="container">
    <h1>Cases Management</h1>

    <div class="search-filter">
        <div>
            <input type="text" id="searchInput" class="search-box" placeholder="Search cases by case number, reporter, location...">
        </div>
    </div>

    <div class="status-filters">
        <div class="status-filter active" data-status="ALL">All Cases</div>
        <div class="status-filter" data-status="OPEN">Open</div>
        <div class="status-filter" data-status="INVESTIGATING">Investigating</div>
        <div class="status-filter" data-status="CLOSED">Closed</div>
        <div class="status-filter" data-status="RESOLVED">Resolved</div>
        <div class="status-filter" data-status="TRANSFERRED">Transferred</div>
    </div>

    <div class="spinner" id="tableSpinner"></div>

    <table id="casesTable">
        <thead>
        <tr>
            <th>Case Number</th>
            <th>Reporter Name</th>
            <th>Date</th>
            <th>Location</th>
            <th>Status</th>
            <th>Officer ID</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Table data will be populated by JavaScript -->
        </tbody>
    </table>

    <div class="pagination" id="pagination">
        <!-- Pagination will be dynamically generated -->
    </div>
</div>

<!-- Case Details Modal -->
<div id="caseDetailsModal" class="modal">
    <div class="modal-content">
        <span class="close" id="closeDetailsModal">&times;</span>
        <h2>Case Details</h2>

        <div class="case-details" id="caseDetailsContent">
            <!-- Case details will be populated by JavaScript -->
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // API base URL
        const apiUrl = '/api/cases';

        // State variables
        let allCases = [];
        let filteredCases = [];
        let currentStatus = 'ALL';
        let currentPage = 1;
        const pageSize = 10;

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const tableSpinner = document.getElementById('tableSpinner');
        const casesTableBody = document.querySelector('#casesTable tbody');
        const paginationContainer = document.getElementById('pagination');
        const statusFilters = document.querySelectorAll('.status-filter');
        const caseDetailsModal = document.getElementById('caseDetailsModal');
        const closeDetailsModal = document.getElementById('closeDetailsModal');
        const caseDetailsContent = document.getElementById('caseDetailsContent');

        // Function to show loading spinner
        function showLoading() {
            document.querySelector('.loading-overlay').style.display = 'flex';
        }

        // Function to hide loading spinner
        function hideLoading() {
            document.querySelector('.loading-overlay').style.display = 'none';
        }

        // Function to show notifications
        function showNotification(message, type) {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `alert alert-${type}`;
            notification.textContent = message;

            // Add to notification area
            document.getElementById('notification-area').appendChild(notification);

            // Auto remove after 3 seconds
            setTimeout(function() {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.5s';
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }

        // Function to format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        // Load all cases
        function loadCases() {
            tableSpinner.style.display = 'block';

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    allCases = data;
                    applyFilters();
                    tableSpinner.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error loading cases:', error);
                    showNotification('Failed to load cases. Please try again later.', 'danger');
                    tableSpinner.style.display = 'none';
                });
        }

        // Apply filters and search
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase();

            filteredCases = allCases.filter(policeCase => {
                // Status filter
                if (currentStatus !== 'ALL' && policeCase.status !== currentStatus) {
                    return false;
                }

                // Search filter
                if (searchTerm) {
                    return (
                        (policeCase.caseNumber && policeCase.caseNumber.toLowerCase().includes(searchTerm)) ||
                        (policeCase.reporterName && policeCase.reporterName.toLowerCase().includes(searchTerm)) ||
                        (policeCase.location && policeCase.location.toLowerCase().includes(searchTerm)) ||
                        (policeCase.reporterIdNumber && policeCase.reporterIdNumber.toLowerCase().includes(searchTerm)) ||
                        (policeCase.officerId && policeCase.officerId.toLowerCase().includes(searchTerm))
                    );
                }

                return true;
            });

            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // Render table with data
        function renderTable() {
            casesTableBody.innerHTML = '';

            if (filteredCases.length === 0) {
                casesTableBody.innerHTML = `
                        <tr>
                            <td colspan="7" class="no-cases">No cases found</td>
                        </tr>
                    `;
                return;
            }

            // Calculate pagination
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = Math.min(startIndex + pageSize, filteredCases.length);
            const casesToShow = filteredCases.slice(startIndex, endIndex);

            casesToShow.forEach(policeCase => {
                const row = document.createElement('tr');

                // Case number
                const caseNumberCell = document.createElement('td');
                caseNumberCell.textContent = policeCase.caseNumber;
                row.appendChild(caseNumberCell);

                // Reporter name
                const reporterNameCell = document.createElement('td');
                reporterNameCell.textContent = policeCase.reporterName;
                row.appendChild(reporterNameCell);

                // Date
                const dateCell = document.createElement('td');
                dateCell.textContent = formatDate(policeCase.date);
                row.appendChild(dateCell);

                // Location
                const locationCell = document.createElement('td');
                locationCell.textContent = policeCase.location;
                row.appendChild(locationCell);

                // Status with styling
                const statusCell = document.createElement('td');
                const statusBadge = document.createElement('span');
                statusBadge.className = `status-badge status-${policeCase.status.toLowerCase()}`;
                statusBadge.textContent = policeCase.status.replace('_', ' ');
                statusCell.appendChild(statusBadge);
                row.appendChild(statusCell);

                // Officer ID
                const officerIdCell = document.createElement('td');
                officerIdCell.textContent = policeCase.officerId;
                row.appendChild(officerIdCell);

                // Actions
                const actionsCell = document.createElement('td');
                const viewBtn = document.createElement('button');
                viewBtn.className = 'btn btn-info btn-sm';
                viewBtn.textContent = 'View Details';
                viewBtn.dataset.id = policeCase.id;
                viewBtn.addEventListener('click', () => showCaseDetails(policeCase.id));
                actionsCell.appendChild(viewBtn);
                row.appendChild(actionsCell);

                casesTableBody.appendChild(row);
            });
        }

        // Render pagination
        function renderPagination() {
            paginationContainer.innerHTML = '';

            if (filteredCases.length === 0) {
                return;
            }

            const totalPages = Math.ceil(filteredCases.length / pageSize);

            // Previous button
            const prevButton = document.createElement('button');
            prevButton.textContent = '← Previous';
            prevButton.disabled = currentPage === 1;
            prevButton.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                    renderPagination();
                }
            });
            paginationContainer.appendChild(prevButton);

            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.className = i === currentPage ? 'active' : '';
                pageButton.addEventListener('click', () => {
                    currentPage = i;
                    renderTable();
                    renderPagination();
                });
                paginationContainer.appendChild(pageButton);
            }

            // Next button
            const nextButton = document.createElement('button');
            nextButton.textContent = 'Next →';
            nextButton.disabled = currentPage === totalPages;
            nextButton.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTable();
                    renderPagination();
                }
            });
            paginationContainer.appendChild(nextButton);
        }

        // Show case details
        function showCaseDetails(caseId) {
            showLoading();

            fetch(`${apiUrl}/${caseId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(caseData => {
                    populateCaseDetails(caseData);
                    caseDetailsModal.style.display = 'block';
                    hideLoading();
                })
                .catch(error => {
                    console.error('Error loading case details:', error);
                    showNotification('Failed to load case details', 'danger');
                    hideLoading();
                });
        }

        // Populate case details in modal
        function populateCaseDetails(caseData) {
            let statusClass = `status-${caseData.status.toLowerCase()}`;

            caseDetailsContent.innerHTML = `
                    <div class="case-detail-row">
                        <div class="case-detail-label">Case Number:</div>
                        <div class="case-detail-value">${caseData.caseNumber}</div>
                    </div>
                    <div class="case-detail-row">
                        <div class="case-detail-label">Status:</div>
                        <div class="case-detail-value">
                            <span class="status-badge ${statusClass}">${caseData.status}</span>
                        </div>
                    </div>
                    <div class="case-detail-row">
                        <div class="case-detail-label">Date Reported:</div>
                        <div class="case-detail-value">${formatDate(caseData.date)}</div>
                    </div>
                    <div class="case-detail-row">
                        <div class="case-detail-label">Location:</div>
                        <div class="case-detail-value">${caseData.location}</div>
                    </div>
                    <div class="case-detail-row">
                        <div class="case-detail-label">Reporter Information:</div>
                        <div class="case-detail-value">
                            <p><strong>Name:</strong> ${caseData.reporterName}</p>
                            <p><strong>Phone:</strong> ${caseData.reporterPhone}</p>
                            <p><strong>ID Number:</strong> ${caseData.reporterIdNumber}</p>
                        </div>
                    </div>
                    <div class="case-detail-row">
                        <div class="case-detail-label">Assigned Officer ID:</div>
                        <div class="case-detail-value">${caseData.officerId}</div>
                    </div>
                    <div class="case-detail-row">
                        <div class="case-detail-label">Description:</div>
                        <div class="case-detail-value">
                            <div class="case-description">${caseData.description}</div>
                        </div>
                    </div>
                `;
        }

        // Event Listeners

        // Search input
        searchInput.addEventListener('input', applyFilters);

        // Status filters
        statusFilters.forEach(filter => {
            filter.addEventListener('click', function() {
                // Remove active class from all filters
                statusFilters.forEach(f => f.classList.remove('active'));

                // Add active class to clicked filter
                this.classList.add('active');

                // Update current status and apply filters
                currentStatus = this.dataset.status;
                applyFilters();
            });
        });

        // Close modal
        closeDetailsModal.addEventListener('click', function() {
            caseDetailsModal.style.display = 'none';
        });

        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === caseDetailsModal) {
                caseDetailsModal.style.display = 'none';
            }
        });

        // Initial load
        loadCases();
    });
</script>
</body>
</html>
