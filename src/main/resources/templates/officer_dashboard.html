<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital OB System - Police Dashboard</title>
    <link rel="stylesheet" href="/static/css/dashboard-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
<!-- Top Navigation Bar -->
<div class="navbar">
    <div class="logo">
        <div class="logo-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1>Digital OB System</h1>
        <small style="color: #ecf0f1; font-size: 0.8rem; margin-left: 1rem;">Officer Portal</small>
    </div>

    <div class="menu">
        <div class="menu-item">
            <a href="#" onclick="loadFragment('manage-cases')" class="active">
                <i class="fas fa-folder-open"></i>
                <span>Cases</span>
            </a>
        </div>

        <div class="menu-item">
            <a href="#" onclick="loadFragment('assigned-cases')">
                <i class="fas fa-user-check"></i>
                <span>My Assigned Cases</span>
            </a>
        </div>
    </div>

    <div class="profile-menu">
        <div class="menu-item">
            <div class="profile-avatar" onclick="toggleDropdown(this)">
                <i class="fas fa-user"></i>
            </div>
            <div class="dropdown">
                <a href="#" onclick="loadFragment('profile')">
                    <i class="fas fa-user-circle"></i>
                    Profile
                </a>
                <a href="#" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Content Area -->
<div class="content">
    <div class="content-inner">
        <div id="content-area">
            <!-- Content will be loaded dynamically here -->
            <div style="text-align: center; padding: 3rem;">
                <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: #3498db; margin-bottom: 1rem;"></i>
                <p style="color: #7f8c8d;">Loading cases...</p>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <p>&copy; <span id="currentYear">2025</span> Digital OB System - Police Portal. All rights reserved.</p>
</div>

<script>
    // Simple alert function
    function showAlert(message, type) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert ${type}`;
        alertDiv.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3000;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: ${type === 'success' ? 'linear-gradient(135deg, #27ae60, #2ecc71)' :
            type === 'error' ? 'linear-gradient(135deg, #e74c3c, #c0392b)' :
                'linear-gradient(135deg, #3498db, #2980b9)'};
        `;
        alertDiv.textContent = message;
        document.body.appendChild(alertDiv);

        setTimeout(() => {
            alertDiv.remove();
        }, 5000);
    }

    // Toggle dropdown function
    function toggleDropdown(element) {
        const dropdown = element.parentElement.querySelector('.dropdown');
        const isVisible = dropdown.classList.contains('show');

        // Close all other dropdowns first
        closeAllDropdowns();

        // Toggle current dropdown
        if (!isVisible) {
            dropdown.classList.add('show');
        }
    }

    // Close all dropdowns
    function closeAllDropdowns() {
        document.querySelectorAll('.dropdown').forEach(dropdown => {
            dropdown.classList.remove('show');
        });
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
        const profileMenu = event.target.closest('.profile-menu');
        const dropdown = event.target.closest('.dropdown');

        // If click is not on profile menu or dropdown, close all dropdowns
        if (!profileMenu && !dropdown) {
            closeAllDropdowns();
        }
    });

    // Load fragment function - using jQuery
    function loadFragment(fragmentName) {
        // Close any open dropdowns
        closeAllDropdowns();

        // Update active menu item
        updateActiveMenuItem(fragmentName);

        // Use jQuery load method
        $("#content-area").load(`fragments/${fragmentName}.html`, function (response, status) {
            if (status === "error") {
                showAlert("Sorry, the page could not be loaded.", "error");
                $("#content-area").html(`
                    <div style="text-align: center; padding: 3rem;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #e74c3c; margin-bottom: 1rem;"></i>
                        <h2 style="color: #2c3e50; margin-bottom: 1rem;">Page Not Found</h2>
                        <p style="color: #7f8c8d;">Sorry, the requested page could not be loaded.</p>
                    </div>
                `);
            }
        });
    }

    // Update active menu item
    function updateActiveMenuItem(fragmentName) {
        // Remove active class from all menu items
        document.querySelectorAll('.menu-item a').forEach(link => {
            link.classList.remove('active');
        });

        // Add active class to current menu item
        const currentLink = document.querySelector(`[onclick="loadFragment('${fragmentName}')"]`);
        if (currentLink) {
            currentLink.classList.add('active');
        }
    }

    // Logout function
    function logout() {
        // Close dropdown first
        closeAllDropdowns();

        if (confirm('Are you sure you want to logout?')) {
            showAlert("Logout successful.", "success");
            setTimeout(() => {
                window.location.replace("/");
            }, 1000);
        }
    }

    // Update current year
    function updateCurrentYear() {
        const yearElement = document.getElementById('currentYear');
        if (yearElement) {
            yearElement.textContent = new Date().getFullYear();
        }
    }

    // Initialize police dashboard
    $(document).ready(function() {
        // Get fragment from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        let fragmentFromParam = urlParams.get('loadFragment');

        // Load the specified fragment or default to manage-cases (not dashboard)
        let fragmentToLoad = fragmentFromParam || 'manage-cases';
        loadFragment(fragmentToLoad);

        updateCurrentYear();
    });
</script>
</body>
</html>
