spring.application.name=DigitalOB
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
server.port=8090
server.servlet.context-path=/
spring.profiles.active=dev
server.servlet.session.timeout=10h
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/digitalob
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.galaxiescoders.laundrysys=INFO
logging.level.org.springframework.web=WARN

# Hikari specific settings
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# Session Configuration
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=10h

# Africa's Talking SMS Configuration
africas.talking.username=shine
africas.talking.api.key=atsk_73bf2b0deba8d4ce89af977047a4b10257dcb882a5317a0dfd1af86ee59262a5a4e5eb8b
africas.talking.sender.id=

# Optional: Set environment (sandbox for testing, live for production)
africas.talking.environment=sandbox
